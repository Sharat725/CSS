<html lang="en">
<head>

    <title>FLAG</title>
    <style>
        #id1,#id2,#id3{
            border: 1px solid red;
           height: 100px;
            width: 350px;
            border: none;
        }
        #id2{
            display: flex;
            justify-content: center;

        }
      #id2>div{
         border: 1px solid red;
         background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0p2M_Qc1fOJi0M6pzojqfs0MqDG85LdDFbo6L4Zgj8w&s=10);

         border-radius: 50%;

      }

        background-color: orange;
      }
      #id2{

      }

      }

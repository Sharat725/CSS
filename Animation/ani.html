<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <Style>
        div{
            border: 2px solid red;
            height: 100px;
            width: 100px;
            margin: 100px;
            background-color: blue;
            animation: chombu;
            animation-duration: 2s;
            animation-duration: alternate-reverse;
            animation-iteration-count: infinite;

        }
        @keyframes chombu{
            0%{
                position: relative;
                top: 0px;
                left: 0px;
                bottom: 0px;
                right: 0px;
                background-color: blue;
                
            }
            25%{
                position: relative;
                top: 200px;
                left: 0px;
                bottom: 0px;
                right: 0px;
                background-color: red;
            }
            50%{
                position: relative;
                top: 200px;
                left: 200px;
                bottom: 0px;
                right: 0px;
                background-color: pink;
            }
            75%{
                position: relative;
                top: 0px;
                left: 200px;
                bottom: 200px;
                right: 0px;
                background-color: yellow;
            }
            100%{
                position: relative;
                top: 0px;
                left: 0px;
                bottom: 200px;
                right: 0px;
                

            }
        }
    </Style>
</head>
<body>
    <div>

    </div>
</body>
</html>
